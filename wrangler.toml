name = "status"
main = "build/worker/shim.mjs"
account_id = "a2a3cd99709f9962a86d9a5de91dee0b"
compatibility_date = "2026-08-01"

[build]
command = "worker-build --release"

# What the probes produced. Create it once with
# `wrangler d1 create health-service`, then paste the id here.
[[d1_databases]]
binding = "DB"
database_name = "health-service"
database_id = "239b6f0a-b653-4690-81a9-d80fd5b9330d"

# What to probe, owned elsewhere and only read here. See
# migrations/config/001_targets.sql for the shape this service expects.
[[d1_databases]]
binding = "CONFIG"
database_name = "status-config"
database_id = "a9e3c451-8a96-4b01-8697-1a5d01a54e19"

# Every five minutes each target is probed once. See the scheduled event in
# src/lib.rs; Cloudflare allows 50 subrequests per invocation on the free
# plan, which is the ceiling on how many targets one sweep can carry.
[triggers]
crons = ["*/5 * * * *"]

# Alerts on a state change. No destination is pinned here: the addresses
# belong to the deployment and live in the settings table, and Cloudflare
# only accepts a recipient the account has verified anyway. Remove this
# block and the sweep simply stops announcing.
[[send_email]]
name = "EMAIL"

# The stylesheet. A request matching a file here never reaches the Worker.
[assets]
directory = "public"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
